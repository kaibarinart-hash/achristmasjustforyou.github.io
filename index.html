
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas!</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">


<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #ffffff 0%, transparent 65%),
    linear-gradient(180deg, #f8f5ef, #eee9df);
  color: #766650;
  font-family: 'Cormorant Garamond', serif;
  overflow-x: hidden;
}

/* SOFT SNOWY BACKGROUND */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .45;
  background-image:
    radial-gradient(#ffffff 1.5px, transparent 1.5px),
    radial-gradient(#d9cdbb 1px, transparent 1px);
  background-size: 45px 45px, 75px 75px;
  background-position: 0 0, 20px 25px;
  z-index: 0;
}

/* HEADER */

header {
  text-align: center;
  padding: 55px 20px 15px;
  position: relative;
  z-index: 1;
}

.subtitle {
  text-transform: uppercase;
  letter-spacing: 5px;
  font-size: 12px;
  color: #b69b70;
}

h1 {
  font-size: clamp(38px, 7vw, 68px);
  font-weight: 500;
  margin: 12px 0;
  color: #9d8768;
  text-shadow: 0 2px 15px #ffffff;
}

header p {
  font-size: 19px;
  color: #a99984;
}

/* CHRISTMAS SCENE */

.scene {
  min-height: 620px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 1;
}

/* TREE */

.tree {
  position: absolute;
  top: 35px;
  font-size: clamp(220px, 38vw, 370px);
  line-height: 1;
  filter:
    drop-shadow(0 12px 12px #8b806633)
    brightness(1.13);
  user-select: none;
}

/* STAR */

.star {
  position: absolute;
  top: 8px;
  font-size: 45px;
  color: #d5b779;
  animation: glow 2s infinite alternate;
  z-index: 2;
}

@keyframes glow {
  from {
    filter: brightness(.9);
    opacity: .8;
  }
  to {
    filter: brightness(1.5) drop-shadow(0 0 12px #e5cb91);
    opacity: 1;
  }
}

/* PRESENTS */

.gifts {
  position: absolute;
  bottom: 45px;
  display: flex;
  justify-content: center;
  align-items: end;
  flex-wrap: wrap;
  gap: 15px;
  width: min(95%, 700px);
  z-index: 3;
}

.gift {
  width: 105px;
  height: 95px;
  border: none;
  cursor: pointer;
  position: relative;
  transition: transform .4s ease, filter .4s ease;
  background: transparent;
}

.gift:hover {
  transform: translateY(-13px) rotate(-3deg);
  filter: drop-shadow(0 10px 12px #a9946b55);
}

/* BOX */

.gift-box {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 76px;
  border-radius: 4px;
  box-shadow:
    0 7px 15px #8c795522,
    inset 0 1px 5px #ffffff99;
}

/* GOLD RIBBON */

.gift-box::before {
  content: "";
  position: absolute;
  width: 15px;
  height: 100%;
  left: 44px;
  background: linear-gradient(
    90deg,
    #c6a66f,
    #fff1cc,
    #d2b783
  );
}

/* STAR ON PRESENT */

.gift-box::after {
  content: "✧";
  position: absolute;
  top: 24px;
  left: 42px;
  font-size: 21px;
  color: #fffdf5;
  text-shadow: 0 1px 5px #c5a66d;
}

/* LID */

.lid {
  position: absolute;
  top: 12px;
  left: -4px;
  width: 113px;
  height: 20px;
  border-radius: 4px;
  z-index: 2;
  box-shadow: 0 3px 6px #8c795522;
}

/* BOW */

.bow {
  position: absolute;
  top: -3px;
  left: 40px;
  z-index: 3;
  font-size: 25px;
  color: #d7b77e;
  filter: drop-shadow(0 2px 2px #9e875533);
}

/* PEARL WHITE */

.gift:nth-child(1) .gift-box,
.gift:nth-child(1) .lid {
  background: linear-gradient(135deg, #fffefa, #e8e1d6);
}

/* WINTER IVORY */

.gift:nth-child(2) .gift-box,
.gift:nth-child(2) .lid {
  background: linear-gradient(135deg, #f8efdf, #e4d4ba);
}

/* FROSTED BLUSH */

.gift:nth-child(3) .gift-box,
.gift:nth-child(3) .lid {
  background: linear-gradient(135deg, #f5e5e4, #dfc6c5);
}

/* CHAMPAGNE */

.gift:nth-child(4) .gift-box,
.gift:nth-child(4) .lid {
  background: linear-gradient(135deg, #eee2c9, #d3bd96);
}

/* FROSTED SAGE */

.gift:nth-child(5) .gift-box,
.gift:nth-child(5) .lid {
  background: linear-gradient(135deg, #dce6d9, #adbfac);
}

/* PRESENT LABELS */

.gift-label {
  position: absolute;
  bottom: -24px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 14px;
  color: #a28d6e;
  white-space: nowrap;
  letter-spacing: 1px;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 20px;
  color: #ad9a7e;
  letter-spacing: 2px;
  font-size: 13px;
  position: relative;
  z-index: 1;
}

/* MODAL OVERLAY */

.overlay {
  position: fixed;
  inset: 0;
  background: #c9c0b2cc;
  backdrop-filter: blur(7px);
  z-index: 10;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.overlay.active {
  display: flex;
}

/* PASSWORD WINDOW */

.modal {
  background: linear-gradient(145deg, #fffefa, #f2eadd);
  color: #76634c;
  padding: 40px 30px;
  width: min(100%, 430px);
  text-align: center;
  border: 1px solid #e5d6bd;
  border-radius: 8px;
  box-shadow: 0 15px 70px #75664b33;
  animation: appear .4s ease;
  position: relative;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal-icon {
  font-size: 45px;
  margin-bottom: 15px;
}

.modal h2 {
  font-size: 32px;
  font-weight: 500;
  margin-bottom: 10px;
}

.modal p {
  font-size: 18px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 13px;
  background: #fffdf8;
  border: 1px solid #d7c5a7;
  text-align: center;
  font-family: inherit;
  font-size: 19px;
  outline: none;
  margin-bottom: 15px;
  color: #76634c;
}

input:focus {
  border-color: #bda477;
  box-shadow: 0 0 8px #d8c49b55;
}

/* BUTTON */

.action {
  border: 1px solid #c8ae7e;
  background: linear-gradient(135deg, #d4bf99, #b89b6d);
  color: white;
  padding: 12px 28px;
  cursor: pointer;
  font-family: inherit;
  font-size: 18px;
  transition: .2s;
}

.action:hover {
  background: #a98d61;
}

/* CLOSE BUTTON */

.close {
  position: absolute;
  top: 12px;
  right: 17px;
  border: none;
  background: none;
  font-size: 25px;
  cursor: pointer;
  color: #a28c6b;
}

/* ERROR */

.error {
  color: #b77d7d;
  font-size: 15px;
  min-height: 20px;
}

/* LETTER */

.letter {
  width: min(100%, 650px);
  max-height: 85vh;
  overflow-y: auto;
  padding: 45px;
  background: linear-gradient(145deg, #fffdf7, #f3eadb);
  color: #74604a;
  border: 1px solid #e5d7c1;
  box-shadow: 0 15px 80px #75664b44;
  animation: appear .7s ease;
  position: relative;
}

.letter h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 43px;
  font-weight: normal;
  text-align: center;
  margin: 15px 0 25px;
  color: #b49a70;
}

.letter .date {
  text-align: right;
  color: #b19a7b;
  font-style: italic;
}

.letter-content {
  font-size: 20px;
  line-height: 1.8;
  white-space: pre-wrap;
}

.signature {
  font-family: 'Great Vibes', cursive;
  font-size: 32px;
  margin-top: 30px;
  text-align: right;
  color: #b49a70;
}

/* MOBILE */

@media(max-width: 500px) {
  .scene {
    min-height: 580px;
  }

  .tree {
    top: 90px;
    font-size: 240px;
  }

  .gifts {
    gap: 9px;
    bottom: 55px;
  }

  .gift {
    width: 82px;
    height: 85px;
  }

  .gift-box {
    height: 65px;
  }

  .gift-box::before {
    left: 34px;
  }

  .gift-box::after {
    left: 32px;
  }

  .lid {
    width: 90px;
  }

  .bow {
    left: 31px;
  }

  .letter {
    padding: 35px 23px;
  }
}
</style>
</head>

<body>

<header>
  <div class="subtitle">A little something for you</div>
  <h1>Merry Christmas!</h1>
  <p>Season's greetings from Kay</p>
</header>

<main class="scene">
  <div class="tree">
  <div class="tree-top"></div>
  <div class="tree-middle"></div>
  <div class="tree-bottom"></div>

  <div class="tree-lights">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="tree-trunk"></div>
</div>

  <div class="gifts" id="gifts"></div>
</main>

<footer>
  MADE WITH LOVE · CHRISTMAS 2026
</footer>

<!-- PASSWORD MODAL -->
<div class="overlay" id="passwordModal">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <div class="modal-icon">🎁</div>
    <h2>A little surprise...</h2>
    <p>This present is waiting for its special passcode.</p>
    <input id="password" type="password"
      placeholder="Enter your passcode">
    <div class="error" id="error"></div>
    <button class="action" onclick="unlockGift()">Open! </button>
  </div>
</div>

<!-- LETTER MODAL -->
<div class="overlay" id="letterModal">
  <div class="letter">
    <button class="close" onclick="closeLetter()">×</button>
    <div class="date" id="letterDate"></div>
    <h2 id="letterTitle"></h2>
    <div class="letter-content" id="letterContent"></div>
    <div class="signature" id="letterSignature"></div>
  </div>
</div>

<script>

// ======================================
// PERSONALIZE YOUR GIFTS HERE
// ======================================

const gifts = [
  {
    name: "Peachy",
    password: "1234",
    title: "A little reminder ♡",
    date: "December 25, 2026",
    message: `Dear you,

Write your first personal letter here.

You can make this as long as you like.
Every word will appear inside this little present.

With love.`,
    signature: "Always yours ♡"
  },
  {
    name: "Yadira",
    password: "memory",
    title: "Remember when...",
    date: "December 25, 2026",
    message: `Dear you,

Write your second letter here.

Maybe a favorite memory, a story, or
something you want them to remember.

I hope this makes you smile.`,
    signature: "With love ♡"
  },
  {
    name: "Light",
    password: "love",
    title: "Something I want you to know",
    date: "December 25, 2026",
    message: `Dear you,

Write your third letter here.

This space is yours to fill with anything
you want to say.`,
    signature: "Forever ♡"
  },
  {
    name: "Inky",
    password: "gift4",
    title: "Just because...",
    date: "December 25, 2026",
    message: `Dear you,

Your fourth letter goes here.`,
    signature: "Yours ♡"
  },
  {
    name: "Ale",
    password: "gift5",
    title: "One last little surprise",
    date: "December 25, 2026",
    message: `Dear you,

Your final letter goes here.`,
    signature: "Merry Christmas!"
  }
];

let selectedGift = null;

// CREATE PRESENTS

const giftContainer = document.getElementById("gifts");

gifts.forEach((gift, index) => {
  const button = document.createElement("button");
  button.className = "gift";
  button.innerHTML = `
    <span class="bow">𝜗ৎ</span>
    <span class="lid"></span>
    <span class="gift-box"></span>
    <span class="gift-label">${gift.name}</span>
  `;

  button.onclick = () => openGift(index);
  giftContainer.appendChild(button);
});

// OPEN A GIFT

function openGift(index) {
  selectedGift = gifts[index];

  document.getElementById("password").value = "";
  document.getElementById("error").textContent = "";

  document.getElementById("passwordModal")
    .classList.add("active");

  setTimeout(() => {
    document.getElementById("password").focus();
  }, 100);
}

// CHECK PASSWORD

function unlockGift() {
  const entered = document.getElementById("password").value;

  if (entered === selectedGift.password) {
    document.getElementById("passwordModal")
      .classList.remove("active");

    document.getElementById("letterTitle").textContent =
      selectedGift.title;

    document.getElementById("letterDate").textContent =
      selectedGift.date;

    document.getElementById("letterContent").textContent =
      selectedGift.message;

    document.getElementById("letterSignature").textContent =
      selectedGift.signature;

    setTimeout(() => {
      document.getElementById("letterModal")
        .classList.add("active");
    }, 350);

  } else {
    document.getElementById("error").textContent =
      "LOUD INCORRECT BUZZER!! Try again?";
  }
}

// CLOSE WINDOWS

function closeModal() {
  document.getElementById("passwordModal")
    .classList.remove("active");
}

function closeLetter() {
  document.getElementById("letterModal")
    .classList.remove("active");
}

// ENTER KEY SUPPORT

document.getElementById("password").addEventListener(
  "keydown", event => {
    if (event.key === "Enter") unlockGift();
  }
);

</script>

</body>
</html>
