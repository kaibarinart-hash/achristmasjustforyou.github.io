
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Merry Christmas!</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- JAVASCRIPT -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="subtitle">
      A little something for you
    </div>

    <h1>Merry Christmas!</h1>

    <p>Season's greetings from Kay</p>
  </header>


  <!-- CHRISTMAS SCENE -->
  <main class="scene">

    <!-- ONE CHRISTMAS TREE -->
    <div class="tree">

      <div class="tree-top"></div>

      <div class="tree-middle"></div>

      <div class="tree-bottom"></div>

      <!-- TREE LIGHTS -->
      <div class="tree-lights">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- TREE TRUNK -->
      <div class="tree-trunk"></div>

    </div>


    <!-- ONE GIFTS CONTAINER -->
    <div class="gifts" id="gifts"></div>

  </main>


  <!-- FOOTER -->
  <footer>
    MADE WITH LOVE · CHRISTMAS 2026
  </footer>


  <!-- PASSWORD MODAL -->
  <div class="overlay" id="passwordModal">

    <div class="modal">

      <button
        class="close"
        type="button"
        onclick="closeModal()"
        aria-label="Close password window">
        ×
      </button>

      <div class="modal-icon">🎁</div>

      <h2>DING DONG! BING BONG!</h2>

      <p>
        This present is waiting for its special passcode, heh.
      </p>

      <input
        id="password"
        type="password"
        placeholder="Enter your passcode"
        autocomplete="off"
      >

      <div class="error" id="error"></div>

      <button
        class="action"
        type="button"
        onclick="unlockGift()">
        Open!
      </button>

    </div>

  </div>


  <!-- LETTER MODAL -->
  <div class="overlay" id="letterModal">

    <div class="letter">

      <button
        class="close"
        type="button"
        onclick="closeLetter()"
        aria-label="Close letter">
        ×
      </button>

      <div class="date" id="letterDate"></div>

      <h2 id="letterTitle"></h2>

      <div
        class="letter-content"
        id="letterContent">
      </div>

      <div
        class="signature"
        id="letterSignature">
      </div>

    </div>

  </div>

</body>
</html>
